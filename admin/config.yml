backend:
  name: git-gateway
  branch: main
site_url: https://www.skylinks.asia
display_url: https://www.skylinks.asia
logo_url: https://www.skylinks.asia/favicon.svg
media_folder: "assets/images"
public_folder: "/assets/images"
collections:
  - name: "empty_legs"
    label: "Empty Legs"
    description: "Every flight here is placed automatically on all matching hub, corridor and region pages. For many flights at once, use Flight Intake at /admin/intake.html."
    files:
      - file: "data/flights.json"
        name: "flights"
        label: "All Flights"
        format: "json"
        fields:
          - {label: "Last updated", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
          - name: "flights"
            label: "Flights"
            widget: "list"
            summary: "{{fields.date}} {{fields.from}} to {{fields.to}} ({{fields.aircraft}})"
            fields:
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "End date (optional)", name: "date_end", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
              - {label: "From (airport code)", name: "from", widget: "string", hint: "Example: OMDW. The build stops and tells you if the code is unknown."}
              - {label: "To (airport code)", name: "to", widget: "string"}
              - {label: "Aircraft", name: "aircraft", widget: "string", hint: "Example: Gulfstream G650ER"}
              - {label: "Seats", name: "seats", widget: "number", value_type: "int", min: 1}
              - {label: "Seats are an estimate", name: "seats_est", widget: "boolean", default: false, required: false, hint: "Tick if the seat count was assumed from the aircraft type. Cards then read Up to N Seats."}
              - {label: "Price (leave empty for On Request)", name: "price", widget: "number", value_type: "int", required: false}
              - {label: "Currency", name: "currency", widget: "select", options: ["USD", "EUR", "GBP", "CNY", "AED", "INR"], default: "USD", required: false}
